<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The GitClicker</title>
<style>
:root{--bg:#eef0e2;--panel:#fff;--ink:#26301a;--mute:#6b7355;--acc:#4e8a12;--cost:#a2541a;--line:#d5dac0;--aura:#7fb81c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a0c;--panel:#1d2612;--ink:#e8efd0;--mute:#98a37a;--acc:#a6e03a;--cost:#f0a060;--line:#323f1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a0c;--panel:#1d2612;--ink:#e8efd0;--mute:#98a37a;--acc:#a6e03a;--cost:#f0a060;--line:#323f1f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif}
body{min-height:100vh}
main{max-width:940px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px}
@media(min-width:760px){main{grid-template-columns:1fr 350px;align-items:start}}
.stage{text-align:center;padding-top:8px}
h1{font-size:1rem;margin:0;color:var(--mute)}
.count{font-size:clamp(2.6rem,9vw,4rem);font-weight:800;line-height:1.05;margin:6px 0 0;font-variant-numeric:tabular-nums}
.rate{color:var(--acc);font-weight:700;margin:2px 0 0;min-height:1.4em}
.field{position:relative;width:min(320px,80vw);aspect-ratio:1;margin:14px auto 4px;display:grid;place-items:center}
.field::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--aura) 0%,transparent 68%);opacity:calc(.15 + var(--stink,1)*.35);transition:opacity .2s}
.field.hit::before{opacity:.8}
.field.gold{--aura:#f2c230}
.puff{position:absolute;bottom:38%;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--aura),transparent 70%);filter:blur(5px);opacity:0;animation:rise 3.2s ease-in infinite;pointer-events:none}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:calc(var(--stink,1)*.75)}100%{transform:translate(var(--dx),-170px) scale(1.5);opacity:0}}
#thing{position:relative;z-index:2;border:0;background:none;padding:0;cursor:pointer;width:76%;aspect-ratio:1;display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s}
#thing:active{transform:scale(.93)}
#thing:focus-visible{outline:3px solid var(--acc);outline-offset:6px;border-radius:24px}
#thing svg{width:100%;display:block}
.emo{font-size:clamp(7rem,30vw,10.5rem);line-height:1;display:block}
.pic{width:100%;border-radius:20px;display:block;box-shadow:0 0 28px #f2c230aa}
.flies{position:absolute;top:2%;right:6%;font-size:1.6rem;animation:buzz .5s linear infinite}
@keyframes buzz{50%{transform:translate(6px,-4px) rotate(10deg)}}
.pop{position:absolute;pointer-events:none;font-weight:800;color:var(--acc);animation:up .9s ease-out forwards;font-size:1.3rem;z-index:3}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.name{font-size:1.4rem;font-weight:800;margin:6px 0 0}
.hint{color:var(--mute);font-size:.9rem;margin:2px 0 0}
aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
aside h2{margin:0 0 10px;font-size:1rem}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.up:hover:not(:disabled){border-color:var(--acc)}
.up:focus-visible{outline:2px solid var(--acc)}
.up:disabled{opacity:.45;cursor:not-allowed}
.up .cost{color:var(--cost);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.up small{grid-column:1/-1;color:var(--mute)}
.up .own{color:var(--mute);font-weight:400;font-size:.85rem}
.evo{border:2px solid var(--acc);margin-bottom:14px}
.win{background:#f2c230;color:#3a2a00;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--mute);font-size:.85rem}
.foot button{font:inherit;color:var(--mute);background:none;border:0;text-decoration:underline;cursor:pointer}
@media(prefers-reduced-motion:reduce){.puff,.flies,.pop{animation:none}#thing{transition:none}}
.up.done{border-color:var(--acc)}.up.done .cost{color:var(--acc)}.ascb{border:2px solid var(--cost)}aside h2{margin-top:6px}.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--cost);width:0}
.nm{display:inline-flex;gap:6px;align-items:center;margin:6px 0 0;color:var(--mute);font-size:.9rem}.nm input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;width:150px}#adm{margin-top:14px}#admb{display:flex;flex-wrap:wrap;gap:6px}#admb button{font:inherit;color:var(--ink);background:none;border:1px solid var(--cost);border-radius:8px;padding:6px 10px;cursor:pointer}
.tip{grid-column:1/-1;display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--panel);border:1px dashed var(--acc);border-radius:12px;padding:8px 12px;font-size:.9rem}
.tip button{font:inherit;font-size:1.2rem;background:none;border:0;color:var(--mute);cursor:pointer}
.scroll{position:relative;max-height:300px;overflow-y:auto;margin-bottom:10px;padding-right:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.row button,#io button,#admb button{font:inherit;color:var(--ink);background:none;border:1px solid var(--acc);border-radius:8px;padding:6px 10px;cursor:pointer}
#io textarea{width:100%;font:.75rem monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.coin{position:fixed;z-index:20;font-size:2.6rem;background:none;border:0;cursor:pointer;animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 0 10px #f2c230)}
@keyframes bob{50%{transform:translateY(-12px) rotate(8deg)}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.pop.crit{color:var(--cost);font-size:1.9rem}
.field.shake{animation:shk .2s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sub{color:var(--mute);font-weight:400;font-size:.85rem}
html{background:var(--bg)}body{background:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
aside,.tip{background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(8px)}
#adm{border-top:1px dashed var(--cost);padding-top:6px}
.af{display:flex;gap:6px;margin-bottom:6px}.af input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.af button{font:inherit;color:var(--ink);background:none;border:1px solid var(--cost);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
#admb{margin-top:6px}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
<div class="tip" id="tip"><span><b>Tip:</b> Open Settings and press Download save to back up your progress. Press Import save to restore it, even on another device.</span><button id="tipx" aria-label="Dismiss tip">×</button></div>
<section class="stage">
  <h1>The GitClicker</h1>
  <label class="nm">Your name <input id="nm" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Enter a name"></label>
  <div class="count" id="count">$0</div>
  <p class="rate" id="rate"></p>
  <div class="field" id="field">
    <span class="puff" style="left:20%;--dx:-30px;animation-delay:0s"></span><span class="puff" style="left:40%;--dx:10px;animation-delay:.9s"></span><span class="puff" style="left:60%;--dx:35px;animation-delay:1.7s"></span><span class="puff" style="left:32%;--dx:-15px;animation-delay:2.3s"></span>
    <button id="thing" aria-label="Tap to earn money"></button>
  </div>
  <p class="name" id="name"></p><p class="hint" id="hint"></p><div id="win"></div>
</section>
<aside>
  <h2>Evolutions <span class="sub" id="evn"></span></h2><div class="scroll" id="evo"></div>
  <h2>Upgrades</h2><div class="scroll" id="shop"></div>
  <h2>Ascension</h2><div id="asc"></div>
  <h2>Ascension upgrades <span class="sub" id="apn"></span></h2><div class="scroll" id="aup"></div>
  <h2>Settings</h2>
  <div class="row"><button id="dl">Download save</button><button id="imp">Import save</button><button id="showio">Save code</button><input id="file" type="file" accept=".json,application/json" hidden></div>
  <div id="io" hidden><textarea id="code" rows="4" spellcheck="false" aria-label="Save code"></textarea><button id="load">Load code</button></div>
  <div id="adm" hidden><h2>Admin panel</h2><div id="admf"></div><div id="admb"></div></div>
  <div class="foot"><span id="stat"></span><button id="reset">Reset progress</button></div>
</aside>
</main>
<div id="toast" role="status"></div>
